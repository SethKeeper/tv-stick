# BlueZ settings for the TV. A separate file (loaded with bluetoothd -f), so Debian's own
# main.conf stays untouched and bluez updates install without questions.
[General]
# New pairings only go through while Settings pairs a device: tvd turns Pairable on for
# that and off again. BlueZ also turns it off by itself after a minute, which covers the
# moment the pairing agent starts (that turns it on).
PairableTimeout = 60
# A paired device that lost its key gets forgotten in Settings and paired again. Letting it
# pair again by itself would let anything that copies its address take its place.
JustWorksRepairing = never
# Headphones and controllers that reconnect by themselves get in faster.
FastConnectable = true

[Policy]
AutoEnable = true
