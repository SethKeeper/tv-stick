# BlueZ settings for the TV. A separate file (loaded with bluetoothd -f), so Debian's own
# main.conf stays untouched and bluez updates install without questions.
[General]
# Keep pairings even if the pairing agent restarts for a moment.
AlwaysPairable = true
# Headphones and controllers that reconnect by themselves get in faster.
FastConnectable = true
# Let a device pair again when it lost the key (reset, or paired in Windows on this PC).
JustWorksRepairing = always

[Policy]
AutoEnable = true
