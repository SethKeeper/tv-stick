# Bluetooth audio for the TV: headphones and speakers always get stereo music quality.
# Without this, a website that opens the microphone flips headphones into the mono
# headset mode. The TV only sends audio (a2dp_source), so no headset profile exists.
wireplumber.settings = {
  bluetooth.autoswitch-to-headset-profile = false
}
monitor.bluez.properties = {
  bluez5.roles = [ a2dp_source ]
}
wireplumber.profiles = {
  main = {
    monitor.bluez.seat-monitoring = disabled
  }
}
